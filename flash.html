<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Projector test</title>
<style>html,body{margin:0;height:100%;background:#000;color:#666;font:20px system-ui;cursor:none}#m{position:fixed;left:20px;bottom:20px}</style></head>
<body><div id="m">Projector test page — waiting for the trainer… (click anywhere for full screen)</div>
<script>
// Test page for the projector screen: the trainer window (same browser) tells it what colour to show,
// so we can time how long AirPlay takes to put a change on the table.
const ch=new BroadcastChannel('pt-display');
document.body.onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
ch.onmessage=e=>{ const d=e.data||{};
  if(d.c){ document.body.style.background=d.c; document.getElementById('m').style.display='none';
    requestAnimationFrame(()=>requestAnimationFrame(()=>ch.postMessage({ack:d.id, t:Date.now()}))); }
  if(d.ping) ch.postMessage({pong:1, w:innerWidth, h:innerHeight, fs:!!document.fullscreenElement}); };
ch.postMessage({hello:1});
// ?clock: a big running clock (same clock on every window of this browser). Open it on both screens and take one
// phone photo showing both: the difference between the two numbers is the AirPlay delay.
if(/clock/.test(location.search)){ const el=document.getElementById('m'); el.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:bold 22vw ui-monospace,Menlo,monospace';
  const tick=()=>{ const t=Date.now()%100000; el.textContent=(t/1000).toFixed(2); requestAnimationFrame(tick); }; tick(); }
</script></body></html>
